<script type="module">
import {paintCampaignRegion,loadCampaignRegionImage} from '/src/adventure/GuairaCampaignArt.ts';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d');const image=await loadCampaignRegionImage('guaira');
function paint(){const w=innerWidth,h=innerHeight,d=devicePixelRatio||1;canvas.width=w*d;canvas.height=h*d;c.setTransform(d,0,0,d,0,0);const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#143d48');g.addColorStop(1,'#326772');c.fillStyle=g;c.fillRect(0,0,w,h);const base=Math.min(w/1.6,h);paintCampaignRegion(c,{width:w,height:h,center:{x:.49,y:.49},zoom:Math.min((w-16)/(1.6*base), (h-140)/base)},'guaira',image);document.body.dataset.ready='true'}paint();addEventListener('resize',paint);
